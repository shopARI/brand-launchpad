<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Brand Launchpad</title>
  <script>
    // GitHub Pages SPA routing fix
    // Redirects all 404s to index.html so React Router can handle them
    // Encodes the path, query, and hash into a redirect param
    var l = window.location;
    l.replace(
      l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
      '/brand-launchpad/' +
      '?redirect=' + encodeURIComponent(
        l.pathname.slice(1) + (l.search ? '&' + l.search.slice(1) : '') + l.hash
      )
    );
  </script>
</head>
<body>
  <p>Redirecting...</p>
</body>
</html>
